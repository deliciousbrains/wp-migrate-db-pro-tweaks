# Server and project configuration
# Note: SONAR_HOST_URL is also passed at scan time. This entry documents the
# expected host and is a no-op when the runtime value takes precedence.
sonar.host.url=https://sonar.wpengine.io/
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Project identifiers
sonar.projectName=wp-migrate-db-pro-tweaks
sonar.projectKey=deliciousbrains_wp-migrate-db-pro-tweaks_3b21842c-26bb-4aea-94ba-25d0193610fe

# Paths to source code directories (relative paths)
sonar.sources=.

# Exclusions — derive from sonar.test.inclusions patterns + language-specific vendor dirs
sonar.exclusions=

# Paths to test code directories (relative paths)
sonar.tests=.
sonar.test.inclusions=**/*Test.php
